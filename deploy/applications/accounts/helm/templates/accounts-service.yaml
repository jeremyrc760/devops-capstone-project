apiVersion: v1
kind: Service
metadata:
  name: accounts
  namespace: {{ include "accounts.namespace" . }}
  labels:
    {{- include "accounts.labels" . | nindent 4 }}
spec:
  type: {{ .Values.accounts.service.type }}
  selector:
    {{- include "accounts.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.accounts.service.port }}
      targetPort: http
      {{- if and (eq .Values.accounts.service.type "NodePort") .Values.accounts.service.nodePort }}
      nodePort: {{ .Values.accounts.service.nodePort }}
      {{- end }}
