apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: accounts
  namespace: accounts
  labels:
    app.kubernetes.io/name: accounts
    app.kubernetes.io/part-of: devops-capstone
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-http01
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - customer-account.api.jeremycloudlabs.com
      secretName: accounts-tls
  rules:
    - host: customer-account.api.jeremycloudlabs.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: accounts
                port:
                  number: 8080