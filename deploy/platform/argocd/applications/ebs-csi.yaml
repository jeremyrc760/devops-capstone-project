apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ebs-csi
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jeremyrc760/devops-capstone-project.git
    targetRevision: aws-kubeadm-gitops
    path: deploy/platform/storage/ebs-csi/helm
    helm:
      releaseName: ebs-csi
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      selfHeal: true