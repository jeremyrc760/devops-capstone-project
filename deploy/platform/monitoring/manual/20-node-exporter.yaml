apiVersion: v1
kind: Service
metadata:
  name: node-exporter
  namespace: monitoring-manual
  labels:
    app.kubernetes.io/name: node-exporter
    app.kubernetes.io/instance: manual
    app.kubernetes.io/part-of: manual-monitoring
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: node-exporter
    app.kubernetes.io/instance: manual
  ports:
    - name: metrics
      port: 19100
      targetPort: metrics
      protocol: TCP

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: monitoring-manual
  labels:
    app.kubernetes.io/name: node-exporter
    app.kubernetes.io/instance: manual
    app.kubernetes.io/part-of: manual-monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-exporter
      app.kubernetes.io/instance: manual

  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-exporter
        app.kubernetes.io/instance: manual
        app.kubernetes.io/part-of: manual-monitoring
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      hostPID: true
      dnsPolicy: ClusterFirstWithHostNet

      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

      containers:
        - name: node-exporter
          image: quay.io/prometheus/node-exporter:v1.12.1-distroless
          imagePullPolicy: IfNotPresent

          args:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --path.rootfs=/host/root
            - --web.listen-address=:19100
            - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/pods/.+)($|/)'

          ports:
            - name: metrics
              containerPort: 19100
              protocol: TCP

          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: proc
              mountPath: /host/proc
              readOnly: true

            - name: sys
              mountPath: /host/sys
              readOnly: true

            - name: root
              mountPath: /host/root
              readOnly: true
              mountPropagation: HostToContainer

      volumes:
        - name: proc
          hostPath:
            path: /proc
            type: Directory

        - name: sys
          hostPath:
            path: /sys
            type: Directory

        - name: root
          hostPath:
            path: /
            type: Directory