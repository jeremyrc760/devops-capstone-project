apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: monitoring-manual
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/instance: manual
    app.kubernetes.io/part-of: manual-monitoring

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics-manual
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - pods
      - services
      - namespaces
    verbs:
      - list
      - watch

  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs:
      - list
      - watch

  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs:
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics-manual
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics-manual
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: monitoring-manual