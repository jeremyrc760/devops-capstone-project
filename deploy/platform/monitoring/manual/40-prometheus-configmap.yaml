apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring-manual
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: manual
    app.kubernetes.io/part-of: manual-monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      scrape_timeout: 10s
      evaluation_interval: 15s

    scrape_configs:

      - job_name: accounts-api
        metrics_path: /metrics
        static_configs:
          - targets:
              - accounts.accounts.svc.cluster.local:8080

      - job_name: cadvisor
        scheme: https

        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token

        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt

        kubernetes_sd_configs:
          - role: node

        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443

          - source_labels:
              - __meta_kubernetes_node_name
            target_label: __metrics_path__
            regex: (.+)
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor

          - source_labels:
              - __meta_kubernetes_node_name
            target_label: instance

      - job_name: kubernetes-apiserver
        scheme: https

        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token

        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt

        kubernetes_sd_configs:
          - role: endpointslice
            namespaces:
              names:
                - default

        relabel_configs:
          - source_labels:
              - __meta_kubernetes_endpointslice_label_kubernetes_io_service_name
            action: keep
            regex: kubernetes

          - source_labels:
              - __meta_kubernetes_endpointslice_port_name
            action: keep
            regex: https

      - job_name: kubelet
        scheme: https

        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token

        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt

        kubernetes_sd_configs:
          - role: node

        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443

          - source_labels:
              - __meta_kubernetes_node_name
            target_label: __metrics_path__
            regex: (.+)
            replacement: /api/v1/nodes/${1}/proxy/metrics

          - source_labels:
              - __meta_kubernetes_node_name
            target_label: instance

      - job_name: coredns
        kubernetes_sd_configs:
          - role: endpointslice
            namespaces:
              names:
                - kube-system

        relabel_configs:
          - source_labels:
              - __meta_kubernetes_endpointslice_label_kubernetes_io_service_name
            action: keep
            regex: kube-dns

          - source_labels:
              - __meta_kubernetes_endpointslice_endpoint_conditions_ready
            action: keep
            regex: "true"

          - source_labels:
              - __meta_kubernetes_endpointslice_port_name
            action: keep
            regex: metrics

      - job_name: prometheus
        static_configs:
          - targets:
              - 127.0.0.1:9090

      - job_name: kube-state-metrics
        static_configs:
          - targets:
              - kube-state-metrics.monitoring-manual.svc.cluster.local:8080

      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: endpointslice
            namespaces:
              names:
                - monitoring-manual

        relabel_configs:
          - source_labels:
              - __meta_kubernetes_endpointslice_label_kubernetes_io_service_name
            action: keep
            regex: node-exporter

          - source_labels:
              - __meta_kubernetes_endpointslice_port
            action: keep
            regex: "19100"

          - source_labels:
              - __meta_kubernetes_endpointslice_endpoint_conditions_ready
            action: keep
            regex: "true"

          - source_labels:
              - __meta_kubernetes_endpointslice_endpoint_node_name
            target_label: instance
