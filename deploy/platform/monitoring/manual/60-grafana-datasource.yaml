apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring-manual
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: manual
    app.kubernetes.io/part-of: manual-monitoring
data:
  prometheus.yaml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring-manual.svc.cluster.local:9090
        isDefault: true
        editable: true